name: mailposture

services:
  mailposture:
    image: ${MAILPOSTURE_IMAGE:?Enter the GHCR image, for example ghcr.io/owner/mailposture:latest}
    pull_policy: always
    container_name: mailposture
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://parsedmarc-opensearch:9200}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-dmarc_aggregate*}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_VERIFY_TLS: ${OPENSEARCH_VERIFY_TLS:-false}
    volumes:
      - mailposture_data:/data
    expose:
      - "8080"
    networks:
      - monitoring
      - proxy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mailposture_data:
    name: ${MAILPOSTURE_DATA_VOLUME:-mailposture_data}

networks:
  monitoring:
    external: true
    name: ${MONITORING_NETWORK:-monitoring}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
