name: mailposture

services:
  mailposture:
    image: ${MAILPOSTURE_IMAGE:?Enter the GHCR image, for example ghcr.io/owner/mailposture:latest}
    pull_policy: always
    container_name: mailposture
    restart: unless-stopped
    depends_on:
      parsedmarc-opensearch:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      MAILPOSTURE_DEPLOYMENT_MODE: standalone
      OPENSEARCH_URL: http://parsedmarc-opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-dmarc_aggregate*}
      OPENSEARCH_FAILURE_INDEX: ${OPENSEARCH_FAILURE_INDEX:-dmarc_failure*,dmarc_forensic*}
      OPENSEARCH_SMTP_TLS_INDEX: ${OPENSEARCH_SMTP_TLS_INDEX:-smtp_tls*}
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set the OpenSearch administrator password}
      OPENSEARCH_VERIFY_TLS: "false"
    volumes:
      - type: bind
        source: ${MAILPOSTURE_SETTINGS_PATH:-${ROOT:?Set ROOT to the parent directory for persistent application data}/mailposture/settings}
        target: /data
      - type: volume
        source: parsedmarc_status
        target: /run/parsedmarc
        read_only: true
    expose:
      - "8080"
    networks:
      - backend
      - proxy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  parsedmarc-opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2}
    container_name: parsedmarc-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      cluster.name: parsedmarc
      node.name: parsedmarc-opensearch
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set the OpenSearch administrator password}
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      bootstrap.memory_lock: "false"
      plugins.security.ssl.http.enabled: "false"
      path.repo: /usr/share/opensearch/snapshots
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - type: bind
        source: ${OPENSEARCH_DATA_PATH:-${ROOT}/mailposture/opensearch/data}
        target: /usr/share/opensearch/data
      - type: bind
        source: ${OPENSEARCH_SNAPSHOT_PATH:-${ROOT}/mailposture/opensearch/snapshots}
        target: /usr/share/opensearch/snapshots
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  parsedmarc:
    image: ghcr.io/domainaware/parsedmarc:${PARSEDMARC_VERSION:-latest}
    container_name: parsedmarc
    restart: unless-stopped
    depends_on:
      parsedmarc-opensearch:
        condition: service_healthy
      mailposture:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        child=""
        write_status() {
          status_state="$$1"
          status_exit="$${2:-null}"
          status_time="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          status_checksum="$$(cksum < /etc/parsedmarc/config.ini 2>/dev/null | awk '{print $$1 ":" $$2}')"
          printf '{"state":"%s","updated_at":"%s","config_checksum":"%s","exit_code":%s}\n' \
            "$$status_state" "$$status_time" "$$status_checksum" "$$status_exit" \
            > /run/mailposture/status.json.tmp
          mv /run/mailposture/status.json.tmp /run/mailposture/status.json
          chmod 644 /run/mailposture/status.json
        }
        stop_child() {
          if [ -n "$$child" ]; then
            kill -TERM "$$child" 2>/dev/null || true
            wait "$$child" 2>/dev/null || true
          fi
          write_status stopped 0
          exit 0
        }
        trap stop_child TERM INT
        while true; do
          while ! grep -q '^\[mailbox\]' /etc/parsedmarc/config.ini 2>/dev/null; do
            write_status waiting_config null
            echo "Waiting for report mailbox settings to be enabled in MailPosture"
            sleep 10
          done
          checksum="$$(cksum < /etc/parsedmarc/config.ini)"
          write_status starting null
          parsedmarc -c /etc/parsedmarc/config.ini &
          child="$$!"
          write_status running null
          while kill -0 "$$child" 2>/dev/null; do
            sleep 10
            updated="$$(cksum < /etc/parsedmarc/config.ini 2>/dev/null || true)"
            if [ "$$updated" != "$$checksum" ]; then
              write_status reloading null
              echo "MailPosture settings changed; reloading parsedmarc"
              kill -TERM "$$child" 2>/dev/null || true
              wait "$$child" 2>/dev/null || true
              child=""
              break
            fi
            write_status running null
          done
          if [ -n "$$child" ]; then
            wait "$$child" 2>/dev/null
            exit_code="$$?"
            write_status error "$$exit_code"
            child=""
          fi
          sleep 2
        done
    environment:
      PARSEDMARC_OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    volumes:
      - type: bind
        source: ${MAILPOSTURE_SETTINGS_PATH:-${ROOT}/mailposture/settings}/parsedmarc
        target: /etc/parsedmarc
        read_only: true
      - type: volume
        source: parsedmarc_status
        target: /run/mailposture
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "test -s /etc/parsedmarc/config.ini && test -r /etc/parsedmarc/config.ini"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  parsedmarc_status:
    name: ${PARSEDMARC_STATUS_VOLUME:-mailposture_parsedmarc_status}

networks:
  backend:
    name: mailposture-backend
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
